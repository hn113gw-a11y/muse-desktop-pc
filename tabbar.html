<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Muse Desktop</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #f6f1e7;
    color: #2b2118;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
  }
  #bar {
    height: 46px;
    flex: 0 0 46px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 10px;
    background: #f6f1e7;
    border-bottom: 1px solid #e3d9c6;
    -webkit-app-region: drag;
  }
  .tab {
    -webkit-app-region: no-drag;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    padding: 4px 12px;
    border: none;
    border-radius: 9px;
    background: transparent;
    cursor: pointer;
    line-height: 1.15;
    color: #2b2118;
  }
  .tab:hover { background: #ede4d0; }
  .tab .name { font-size: 13px; font-weight: 600; }
  .tab .role { font-size: 10px; color: #8a7a63; }
  .tab.active {
    background: linear-gradient(135deg, #f76707, #e03131);
    color: #fff;
  }
  .tab.active .role { color: #ffd8c2; }
  #spacer { flex: 1; }
  #hint { font-size: 11px; color: #8a7a63; margin-right: 8px; }
  #sleep {
    -webkit-app-region: no-drag;
    padding: 6px 10px;
    border: 1px solid #e3d9c6;
    border-radius: 9px;
    background: #fffdf8;
    cursor: pointer;
    font-size: 12px;
    color: #2b2118;
  }
  #sleep:hover { background: #ede4d0; }
  #sleep:disabled { opacity: 0.45; cursor: default; }
  #stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #8a7a63;
    font-size: 14px;
    background: #fffdf8;
  }
</style>
</head>
<body>
  <div id="bar">
    <div id="tabs"></div>
    <div id="spacer"></div>
    <div id="hint">Ctrl+1..5 để đổi e</div>
    <button id="sleep" title="Dong phien cua e hien tai de giai phong RAM">Cho e này đi ngủ</button>
  </div>
  <div id="stage">Đang gọi các e Muse vào nhà chung...</div>

<script>
  const PROFILES = [
    { id: 'chinh', name: 'Em chính', role: 'Chính' },
    { id: 'miu',   name: 'Miu',      role: 'Nghiên cứu' },
    { id: 'bo',    name: 'Bơ',       role: 'Kỹ thuật' },
    { id: 'sua',   name: 'Sứa',      role: 'Phản biện' },
    { id: 'nep',   name: 'Nếp',      role: 'Thư ký' },
  ];
  const tabsEl = document.getElementById('tabs');
  tabsEl.style.display = 'flex';
  tabsEl.style.gap = '6px';
  const sleepBtn = document.getElementById('sleep');
  let activeId = 'chinh';

  function render() {
    tabsEl.innerHTML = '';
    for (const p of PROFILES) {
      const b = document.createElement('button');
      b.className = 'tab' + (p.id === activeId ? ' active' : '');
      b.innerHTML = '<span class="name"></span><span class="role"></span>';
      b.querySelector('.name').textContent = p.name;
      b.querySelector('.role').textContent = p.role;
      b.addEventListener('click', () => window.museShell.select(p.id));
      tabsEl.appendChild(b);
    }
    sleepBtn.disabled = activeId === 'chinh';
    sleepBtn.title = activeId === 'chinh'
      ? 'Em chính luôn trực nhà, không đi ngủ'
      : 'Đóng phiên của e hiện tại để giải phóng RAM';
  }

  sleepBtn.addEventListener('click', () => window.museShell.sleep());
  window.museShell.onActive((id) => { activeId = id; render(); });
  render();
</script>
</body>
</html>
